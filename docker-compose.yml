version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: itantra-backend
    ports:
      - "8000:8000"
    environment:
      - BHASHINI_USER_ID=${BHASHINI_USER_ID:-}
      - BHASHINI_API_KEY=${BHASHINI_API_KEY:-}
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - RADIO_BITRATE_BPS=2400
      - RADIO_BER=0.001
    volumes:
      - ./models:/app/models
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: itantra-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_WS=ws://localhost:8000/ws/transceive
    depends_on:
      - backend
    restart: unless-stopped
